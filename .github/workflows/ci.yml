name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The machine whose loader and pridem check read primer.yaml (contract 3,
  # 1.19: packages with apply).
  PRIDEM_COMMIT: 81e1f66fb46532494de46e754c279ca82af2569e
  # The published packages of the blank (DM-58), by their tags: public
  # repositories of PACKAGES_OWNER, cloned over https.
  PACKAGES_OWNER: VELO2026-app
  SKIN_TAG: v1.0.0
  TEXTS_TAG: v1.0.0
  BRAND_TAG: v1.0.0

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: blank
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blank -d blank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://blank:ci-only-password@127.0.0.1:5432/blank_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from the lock
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff
        run: |
          ruff check . ../probes ../ci
          ruff format --check . ../probes ../ci
      - name: Mypy
        run: |
          mypy .
          mypy --config-file pyproject.toml ../probes
      - name: Pytest
        run: python -m pytest tests/ --junitxml=/tmp/junit.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  image:
    name: Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from the lock
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
      - name: Pinned base images resolve in the registry
        # Every pinned name:tag@sha256 must resolve; the digest the tag points
        # to now is printed beside it, for the record.
        run: |
          for ref in $(.venv/bin/python ci/check_image_pins.py --list); do
            echo "== $ref"
            docker buildx imagetools inspect "$ref" | grep -m1 '^Digest:'
            echo "tag now -> $(docker buildx imagetools inspect "${ref%@*}" | grep -m1 '^Digest:')"
          done
      - name: The published packages at their tags
        run: |
          git clone -q --depth 1 --branch "$SKIN_TAG" "https://github.com/$PACKAGES_OWNER/primer-blank-skin.git" "$RUNNER_TEMP/skin"
          git clone -q --depth 1 --branch "$TEXTS_TAG" "https://github.com/$PACKAGES_OWNER/primer-blank-texts.git" "$RUNNER_TEMP/texts"
          git clone -q --depth 1 --branch "$BRAND_TAG" "https://github.com/$PACKAGES_OWNER/primer-blank-brand.git" "$RUNNER_TEMP/brand"
          echo "PRIMER_BLANK_SKIN=$RUNNER_TEMP/skin" >> "$GITHUB_ENV"
          echo "PRIMER_BLANK_TEXTS=$RUNNER_TEMP/texts" >> "$GITHUB_ENV"
          echo "PRIMER_BLANK_BRAND=$RUNNER_TEMP/brand" >> "$GITHUB_ENV"
      - name: Probes of the built images
        run: .venv/bin/python -m pytest probes -v -p no:cacheprovider

  check:
    name: primer.yaml through pridem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pridem at the pinned commit (its own recipe)
        run: |
          git clone https://github.com/inzoddwetrust/primer.git "$RUNNER_TEMP/pridem"
          cd "$RUNNER_TEMP/pridem"
          git checkout --detach "$PRIDEM_COMMIT"
          test "$(git rev-parse HEAD)" = "$PRIDEM_COMMIT"
          python -m venv .venv
          .venv/bin/pip install --no-index --find-links wheels/ --require-hashes -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pip freeze --exclude-editable > "$RUNNER_TEMP/runtime.txt"
          .venv/bin/pip install -c "$RUNNER_TEMP/runtime.txt" -e ".[dev]"
          echo "$RUNNER_TEMP/pridem/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint the check
        run: |
          ruff check ci
          ruff format --check ci
          mypy --strict --disallow-any-explicit ci/check_primer_yaml.py ci/check_image_pins.py
      - name: Selftest of the checks
        run: |
          python ci/check_primer_yaml.py primer.yaml --selftest
          python ci/check_image_pins.py --selftest
      - name: primer.yaml
        run: python ci/check_primer_yaml.py primer.yaml
      - name: Images pinned by tag and digest
        run: python ci/check_image_pins.py
      - name: The repository and its packages through pridem check
        # The directory by its absolute path: pridem check names the verdict's
        # first step by the directory's name, and "." has none.
        run: |
          git clone -q --depth 1 --branch "$SKIN_TAG" "https://github.com/$PACKAGES_OWNER/primer-blank-skin.git" "$RUNNER_TEMP/skin"
          git clone -q --depth 1 --branch "$TEXTS_TAG" "https://github.com/$PACKAGES_OWNER/primer-blank-texts.git" "$RUNNER_TEMP/texts"
          git clone -q --depth 1 --branch "$BRAND_TAG" "https://github.com/$PACKAGES_OWNER/primer-blank-brand.git" "$RUNNER_TEMP/brand"
          pridem check "$GITHUB_WORKSPACE" skin="$RUNNER_TEMP/skin" texts="$RUNNER_TEMP/texts"
          pridem check "$GITHUB_WORKSPACE" skin="$RUNNER_TEMP/brand/skin" texts="$RUNNER_TEMP/brand/texts"
