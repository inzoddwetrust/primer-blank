schema: 1
name: blank
kind: product

dependencies:                         # the machine's test service (DM-59); exact version -- primer.lock
  primer-blank-service:
    repo: file:///srv/tier3/primer-blank-service.git   # tier 3 puts the service's mirror here
    version: ">=1,<2"
    data: { profile: profile }        # form D: profile/ goes to the service, its validate checks it

editions:                             # a service the product takes a seam from is in every edition (rule 41)
  core: { services: [primer-blank-service] }

languages: [en, ru]                   # every language the product has: its built-in texts

stacks:
  blank:
    compose: docker-compose.yml
    app:      { service: app, port: 8000, health: /health, ready: /ready }
    frontend: { service: frontend, port: 80 }
    migrate:  python -m alembic upgrade head
    test:     { run: python -m pytest tests/ --junitxml=/tmp/junit.xml, target: test }
    seeds:
      bootstrap: { run: python -m app.seed bootstrap, when: install }

env:
  POSTGRES_PASSWORD: { source: minted }
  EDITION:           { source: passport, key: edition, enum: editions }
  API_BASE_URL:      { source: passport, key: domains.api }
  LANGUAGES:         { source: passport, key: languages }          # the instance's, by commas
  DEFAULT_LANGUAGE:  { source: passport, key: default_language }
  SERVICE_API_URL:   { source: seam, from: primer-blank-service }   # its address
  SERVICE_TOKEN:     { source: seam, from: primer-blank-service }   # minted by it
  SERVICE_KEY:       { source: seam, from: primer-blank-service }   # derived by it

provides:                             # what the product gives its service
  PRODUCT_WEBHOOK_URL: { from: domains.api, path: /internal/service/webhook }

packages:
  skin:
    contract: ">=1,<2"
    apply: runtime
    validate: validate-skin <dir>
    mount:
      - { service: frontend, path: /srv/skin }
  texts:
    contract: ">=1,<2"
    apply: runtime
    validate: validate-texts <dir>
    mount:
      - { service: frontend, path: /srv/texts }

host:
  domains: [frontend, api]
  routes:
    frontend: { to: "frontend:80" }
    api:      { to: "app:8000", max_body: 1M }

report: { health: /health, ready: /ready, logs: json, junit: true }
